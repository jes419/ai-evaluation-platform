requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4",
    "ollama>=0.6.3",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.1.1",
]
